<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MOB% — NUR425 Study</title>
<style>
:root {
  --bg: #080810;
  --card: #0f0f1a;
  --border: #1e1e35;
  --purple: #7c3aed;
  --purple-light: #a78bfa;
  --cyan: #06b6d4;
  --text: #f1f5f9;
  --muted: #64748b;
  --correct: #10b981;
  --wrong: #ef4444;
  --glow: 0 0 20px rgba(124,58,237,0.5);
  --glow-strong: 0 0 40px rgba(124,58,237,0.8), 0 0 80px rgba(124,58,237,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: var(--text); overscroll-behavior: none; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ── HOME ── */
#screen-home { padding: 24px 20px 40px; }
.home-header { text-align: center; margin-bottom: 28px; }
.home-title { font-size: 13px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.home-name { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, var(--purple-light), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* Gauge */
.gauge-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; }
.gauge-ring { position: relative; width: 160px; height: 160px; }
.gauge-svg { width: 160px; height: 160px; transform: rotate(-90deg); }
.gauge-track { fill: none; stroke: var(--border); stroke-width: 10; }
.gauge-fill { fill: none; stroke: url(#gaugeGrad); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 408; stroke-dashoffset: 408; transition: stroke-dashoffset 1s cubic-bezier(.4,0,.2,1); }
.gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gauge-pct { font-size: 42px; font-weight: 900; line-height: 1; color: var(--text); }
.gauge-pct.glow { text-shadow: 0 0 20px var(--purple-light); }
.gauge-label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
.streak-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.streak-badge { background: rgba(124,58,237,.2); border: 1px solid var(--purple); border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: 700; color: var(--purple-light); }

/* Modules grid */
.section-label { font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
.modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.module-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 14px; cursor: pointer; transition: border-color .2s, box-shadow .2s; position: relative; overflow: hidden; }
.module-card:active { transform: scale(.97); }
.module-card.has-progress { border-color: rgba(124,58,237,.4); }
.module-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--purple), var(--cyan)); transform: scaleX(0); transform-origin: left; transition: transform .4s ease; }
.module-card.has-progress::before { transform: scaleX(1); }
.mod-tag { font-size: 10px; font-weight: 800; color: var(--purple-light); letter-spacing: 1px; margin-bottom: 6px; }
.mod-name { font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--text); margin-bottom: 10px; }
.mod-bar-wrap { background: var(--border); border-radius: 4px; height: 4px; }
.mod-bar { background: linear-gradient(90deg, var(--purple), var(--cyan)); border-radius: 4px; height: 4px; width: 0%; transition: width .6s ease; }
.mod-stat { font-size: 10px; color: var(--muted); margin-top: 5px; }

/* ── DRILL ── */
#screen-drill { padding: 20px 20px 40px; display: flex; flex-direction: column; }
.drill-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }
.drill-module-tag { font-size: 11px; font-weight: 800; color: var(--purple-light); letter-spacing: 1px; }
.drill-progress-row { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.drill-progress-text { font-size: 12px; color: var(--muted); }
.drill-progress-bar { width: 60px; height: 4px; background: var(--border); border-radius: 4px; }
.drill-progress-fill { height: 4px; background: var(--purple); border-radius: 4px; transition: width .3s; }

.qcard { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 18px; margin-bottom: 16px; }
.q-concept { font-size: 10px; font-weight: 700; color: var(--purple-light); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
.q-stem { font-size: 15px; line-height: 1.65; color: var(--text); }

.options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.option-btn {
  background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
  padding: 14px 16px; text-align: left; cursor: pointer;
  font-size: 14px; color: var(--text); line-height: 1.5; transition: border-color .15s, background .15s;
}
.option-btn:active { background: rgba(124,58,237,.1); }
.option-btn.selected { border-color: var(--purple); background: rgba(124,58,237,.12); }
.option-btn.correct { border-color: var(--correct); background: rgba(16,185,129,.12); color: var(--correct); }
.option-btn.wrong { border-color: var(--wrong); background: rgba(239,68,68,.12); color: var(--wrong); }
.option-btn:disabled { cursor: default; }

.submit-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--purple); color: white; font-size: 15px; font-weight: 800; cursor: pointer; letter-spacing: .5px; transition: opacity .15s; }
.submit-btn:disabled { opacity: .4; cursor: default; }
.submit-btn.next { background: var(--card); border: 1.5px solid var(--purple); color: var(--purple-light); }

.rationale-box { background: rgba(124,58,237,.08); border: 1px solid rgba(124,58,237,.25); border-radius: 12px; padding: 16px; margin-top: 14px; display: none; }
.rationale-box.show { display: block; }
.rationale-label { font-size: 10px; font-weight: 800; color: var(--purple-light); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.rationale-text { font-size: 13px; line-height: 1.7; color: #cbd5e1; margin-bottom: 10px; }
.trap-box { background: rgba(239,68,68,.08); border-left: 3px solid var(--wrong); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 12px; color: #fca5a5; line-height: 1.6; }
.trap-label { font-size: 10px; font-weight: 700; color: var(--wrong); letter-spacing: 1px; display: block; margin-bottom: 4px; }

/* result flash */
.result-flash { text-align: center; font-size: 22px; font-weight: 900; padding: 8px 0; display: none; }
.result-flash.show { display: block; }
.result-flash.correct { color: var(--correct); }
.result-flash.wrong { color: var(--wrong); }

/* ── SUMMARY ── */
#screen-summary { padding: 24px 20px 60px; }
.sum-header { text-align: center; margin-bottom: 28px; }
.sum-score { font-size: 64px; font-weight: 900; line-height: 1; }
.sum-score.perfect { color: var(--cyan); text-shadow: 0 0 30px rgba(6,182,212,.7); }
.sum-score.good { color: var(--correct); }
.sum-score.average { color: #f59e0b; }
.sum-score.low { color: var(--wrong); }
.sum-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sum-module-tag { font-size: 12px; font-weight: 700; color: var(--purple-light); margin-top: 6px; letter-spacing: 1px; }

.sum-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 16px; margin-bottom: 14px; }
.sum-section-title { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
.sum-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 12px; }
.sum-row:last-child { border-bottom: none; }
.sum-concept { font-size: 13px; color: var(--text); flex: 1; line-height: 1.4; }
.sum-badge { font-size: 11px; font-weight: 700; border-radius: 20px; padding: 2px 10px; white-space: nowrap; }
.sum-badge.correct { background: rgba(16,185,129,.2); color: var(--correct); }
.sum-badge.wrong { background: rgba(239,68,68,.2); color: var(--wrong); }
.sm2-output { background: #0a0a16; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.8; color: #94a3b8; white-space: pre-wrap; overflow-x: auto; max-height: 280px; overflow-y: auto; }
.sm2-output .label { color: var(--purple-light); }
.action-row { display: flex; gap: 10px; margin-top: 6px; }
.btn { padding: 13px 18px; border-radius: 11px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; flex: 1; }
.btn-primary { background: var(--purple); color: white; }
.btn-secondary { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
.btn-copy { background: rgba(124,58,237,.2); color: var(--purple-light); border: 1px solid rgba(124,58,237,.4); }
.btn-copy.copied { background: rgba(16,185,129,.2); color: var(--correct); border-color: var(--correct); }

/* 100% explosion */
@keyframes explode {
  0% { transform: scale(1); filter: brightness(1); }
  30% { transform: scale(1.08); filter: brightness(2.5) blur(1px); }
  60% { transform: scale(0.98); filter: brightness(1.5); }
  100% { transform: scale(1); filter: brightness(1); }
}
@keyframes psychicPulse {
  0%, 100% { box-shadow: none; }
  50% { box-shadow: 0 0 60px rgba(124,58,237,.8), 0 0 120px rgba(6,182,212,.4); }
}
.exploding { animation: explode .6s ease, psychicPulse 1.5s ease 0s 3; }

/* Mob icon (SVG-based, simplified) */
.mob-figure { text-align: center; margin-bottom: 8px; font-size: 48px; filter: drop-shadow(0 0 12px rgba(124,58,237,.8)); }

/* Scrollable content wrapper */
.scroll-wrap { overflow-y: auto; }
</style>
</head>
<body>

<!-- ══ HOME ══════════════════════════════════════════════════════════════════ -->
<div class="screen active" id="screen-home">
  <div id="home-content">
    <div class="home-header">
      <div class="mob-figure">🌀</div>
      <div class="home-title">Shigeo Kageyama</div>
      <div class="home-name">NUR425 Final Prep</div>
    </div>

    <div class="gauge-wrap">
      <div class="gauge-ring" id="gauge-ring">
        <svg class="gauge-svg" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#7c3aed"/>
              <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
          </defs>
          <circle class="gauge-track" cx="80" cy="80" r="65"/>
          <circle class="gauge-fill" id="gauge-fill" cx="80" cy="80" r="65"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-pct" id="gauge-pct">0%</div>
          <div class="gauge-label">psychic output</div>
        </div>
      </div>
      <div class="streak-row">
        <div class="streak-badge" id="streak-badge">🔥 0 day streak</div>
      </div>
    </div>

    <div class="section-label">Select Module</div>
    <div class="modules-grid" id="modules-grid"></div>
  </div>
</div>

<!-- ══ DRILL ══════════════════════════════════════════════════════════════════ -->
<div class="screen" id="screen-drill">
  <div class="drill-header">
    <div class="back-btn" onclick="goHome()">←</div>
    <div class="drill-module-tag" id="drill-mod-tag">M7</div>
    <div class="drill-progress-row">
      <div class="drill-progress-text" id="drill-prog-text">1/8</div>
      <div class="drill-progress-bar"><div class="drill-progress-fill" id="drill-prog-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="qcard">
    <div class="q-concept" id="q-concept"></div>
    <div class="q-stem" id="q-stem"></div>
  </div>

  <div class="options-list" id="options-list"></div>

  <div class="result-flash" id="result-flash"></div>

  <button class="submit-btn" id="submit-btn" disabled onclick="submitAnswer()">Submit</button>

  <div class="rationale-box" id="rationale-box">
    <div class="rationale-label">Rationale</div>
    <div class="rationale-text" id="rationale-text"></div>
    <div class="trap-box"><span class="trap-label">⚠ EXAM TRAP</span><span id="trap-text"></span></div>
  </div>
</div>

<!-- ══ SUMMARY ═════════════════════════════════════════════════════════════════ -->
<div class="screen" id="screen-summary">
  <div class="sum-header">
    <div class="sum-score" id="sum-score">0/8</div>
    <div class="sum-sub" id="sum-sub">0 correct</div>
    <div class="sum-module-tag" id="sum-mod-tag">M7 — Fluids & Electrolytes</div>
  </div>

  <div class="sum-section">
    <div class="sum-section-title">Question Breakdown</div>
    <div id="sum-breakdown"></div>
  </div>

  <div class="sum-section">
    <div class="sum-section-title">SM-2 Update — Paste to Claude</div>
    <div class="sm2-output" id="sm2-output"></div>
    <div class="action-row" style="margin-top:12px">
      <button class="btn btn-copy" id="copy-btn" onclick="copyOutput()">📋 Copy</button>
    </div>
  </div>

  <div class="action-row" style="margin-top:4px">
    <button class="btn btn-primary" onclick="goHome()">Back to Home</button>
    <button class="btn btn-secondary" id="retry-btn" onclick="retryModule()">Retry Module</button>
  </div>
</div>

<script src="questions.js"></script>
<script>
// ═══ MODULE CONFIG ════════════════════════════════════════════════════════════
const MODULES = [
  { key: "M7",  tag: "M7",  name: "Fluids & Electrolytes",         color: "#7c3aed" },
  { key: "M8",  tag: "M8",  name: "Elimination — AGN / Nephrotic", color: "#0891b2" },
  { key: "M9",  tag: "M9",  name: "Cardiac — CHD & GI Meds",       color: "#7c3aed" },
  { key: "M10", tag: "M10", name: "Heart Failure in CHD",          color: "#0891b2" },
  { key: "M11", tag: "M11", name: "Intracranial Regulation",        color: "#7c3aed" },
  { key: "M12", tag: "M12", name: "Surgical Issues",               color: "#0891b2" },
];

// ═══ STATE ════════════════════════════════════════════════════════════════════
let currentModule = null;
let currentQuestions = [];
let currentIdx = 0;
let selectedOption = null;
let answered = false;
let sessionResults = [];

// ═══ STORAGE HELPERS ══════════════════════════════════════════════════════════
function getStore() {
  try { return JSON.parse(localStorage.getItem("mob_study") || "{}"); }
  catch { return {}; }
}
function setStore(data) {
  try { localStorage.setItem("mob_study", JSON.stringify(data)); }
  catch {}
}
function getModuleStats(key) {
  const s = getStore();
  return s[key] || { correct: 0, total: 0, history: [] };
}
function saveModuleResult(key, results) {
  const s = getStore();
  if (!s[key]) s[key] = { correct: 0, total: 0, history: [] };
  const correct = results.filter(r => r.correct).length;
  s[key].correct += correct;
  s[key].total += results.length;
  s[key].history.push({ date: todayStr(), correct, total: results.length, results });
  if (s[key].history.length > 20) s[key].history.shift();
  setStore(s);
}

// ═══ STREAK ═══════════════════════════════════════════════════════════════════
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function updateStreak() {
  const s = getStore();
  const today = todayStr();
  const last = s.lastStudy;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (last === today) return s.streak || 1;
  if (last === yesterday) {
    s.streak = (s.streak || 0) + 1;
  } else if (!last) {
    s.streak = 1;
  } else {
    s.streak = 1;
  }
  s.lastStudy = today;
  setStore(s);
  return s.streak;
}
function getStreak() {
  const s = getStore();
  if (s.lastStudy !== todayStr()) return s.streak || 0;
  return s.streak || 0;
}

// ═══ GAUGE ════════════════════════════════════════════════════════════════════
function calcOverallPct() {
  let totalCorrect = 0, totalQ = 0;
  MODULES.forEach(m => {
    const stats = getModuleStats(m.key);
    if (stats.total > 0) { totalCorrect += stats.correct; totalQ += stats.total; }
  });
  if (totalQ === 0) return 0;
  return Math.round((totalCorrect / totalQ) * 100);
}
function updateGauge(pct) {
  const fill = document.getElementById("gauge-fill");
  const pctEl = document.getElementById("gauge-pct");
  const circumference = 408;
  const offset = circumference - (pct / 100) * circumference;
  fill.style.strokeDashoffset = offset;
  pctEl.textContent = pct + "%";
  if (pct >= 80) pctEl.classList.add("glow");
  else pctEl.classList.remove("glow");
  if (pct === 100) {
    document.getElementById("gauge-ring").classList.add("exploding");
    setTimeout(() => document.getElementById("gauge-ring").classList.remove("exploding"), 2500);
  }
}

// ═══ HOME SCREEN ══════════════════════════════════════════════════════════════
function renderHome() {
  const pct = calcOverallPct();
  updateGauge(pct);
  const streak = getStreak();
  document.getElementById("streak-badge").textContent =
    streak > 0 ? `🔥 ${streak} day streak` : "Start your streak";

  const grid = document.getElementById("modules-grid");
  grid.innerHTML = "";
  MODULES.forEach(m => {
    const stats = getModuleStats(m.key);
    const modPct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    const hasProgress = stats.total > 0;
    const card = document.createElement("div");
    card.className = "module-card" + (hasProgress ? " has-progress" : "");
    card.innerHTML = `
      <div class="mod-tag">${m.tag}</div>
      <div class="mod-name">${m.name}</div>
      <div class="mod-bar-wrap"><div class="mod-bar" style="width:${modPct}%"></div></div>
      <div class="mod-stat">${stats.total > 0 ? modPct + "% (" + stats.correct + "/" + stats.total + ")" : "Not started"}</div>
    `;
    card.addEventListener("click", () => startModule(m.key));
    grid.appendChild(card);
  });
}

// ═══ DRILL ════════════════════════════════════════════════════════════════════
function startModule(key) {
  currentModule = key;
  currentQuestions = [...(QUESTIONS[key] || [])];
  // Shuffle
  for (let i = currentQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
  }
  currentIdx = 0;
  sessionResults = [];
  updateStreak();
  switchTo("screen-drill");
  loadQuestion(0);
  const mod = MODULES.find(m => m.key === key);
  document.getElementById("drill-mod-tag").textContent = mod ? mod.tag + " — " + mod.name : key;
}

function loadQuestion(i) {
  const q = currentQuestions[i];
  selectedOption = null;
  answered = false;

  document.getElementById("q-concept").textContent = q.concept;
  document.getElementById("q-stem").textContent = q.stem;

  const pct = (i / currentQuestions.length) * 100;
  document.getElementById("drill-prog-fill").style.width = pct + "%";
  document.getElementById("drill-prog-text").textContent = `${i + 1}/${currentQuestions.length}`;

  const optList = document.getElementById("options-list");
  optList.innerHTML = "";
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.dataset.idx = idx;
    btn.addEventListener("click", () => selectOption(btn, idx));
    optList.appendChild(btn);
  });

  document.getElementById("submit-btn").disabled = true;
  document.getElementById("submit-btn").textContent = "Submit";
  document.getElementById("submit-btn").className = "submit-btn";
  document.getElementById("submit-btn").onclick = submitAnswer;
  document.getElementById("rationale-box").classList.remove("show");
  document.getElementById("result-flash").classList.remove("show", "correct", "wrong");
  document.getElementById("result-flash").textContent = "";
}

function selectOption(btn, idx) {
  if (answered) return;
  document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  selectedOption = idx;
  document.getElementById("submit-btn").disabled = false;
}

function submitAnswer() {
  if (selectedOption === null || answered) return;
  answered = true;
  const q = currentQuestions[currentIdx];
  const letter = String.fromCharCode(65 + selectedOption);
  const isCorrect = q.correct.includes(letter);

  document.querySelectorAll(".option-btn").forEach((btn, idx) => {
    btn.disabled = true;
    const l = String.fromCharCode(65 + idx);
    if (q.correct.includes(l)) btn.classList.add("correct");
    else if (idx === selectedOption && !isCorrect) btn.classList.add("wrong");
  });

  const flash = document.getElementById("result-flash");
  flash.textContent = isCorrect ? "✓ CORRECT" : "✗ WRONG";
  flash.className = "result-flash show " + (isCorrect ? "correct" : "wrong");

  document.getElementById("rationale-text").textContent = q.rationale;
  document.getElementById("trap-text").textContent = q.trap;
  document.getElementById("rationale-box").classList.add("show");

  sessionResults.push({ id: q.id, concept: q.concept, correct: isCorrect, letter });

  const submitBtn = document.getElementById("submit-btn");
  if (currentIdx + 1 < currentQuestions.length) {
    submitBtn.textContent = "Next Question →";
    submitBtn.className = "submit-btn next";
    submitBtn.onclick = nextQuestion;
  } else {
    submitBtn.textContent = "See Results";
    submitBtn.className = "submit-btn";
    submitBtn.onclick = showSummary;
  }
}

function nextQuestion() {
  currentIdx++;
  loadQuestion(currentIdx);
}

// ═══ SUMMARY ══════════════════════════════════════════════════════════════════
function showSummary() {
  saveModuleResult(currentModule, sessionResults);

  const correct = sessionResults.filter(r => r.correct).length;
  const total = sessionResults.length;
  const pct = Math.round((correct / total) * 100);

  const scoreEl = document.getElementById("sum-score");
  scoreEl.textContent = correct + "/" + total;
  scoreEl.className = "sum-score " + (pct === 100 ? "perfect" : pct >= 75 ? "good" : pct >= 50 ? "average" : "low");

  const mod = MODULES.find(m => m.key === currentModule);
  document.getElementById("sum-sub").textContent = `${pct}% accurate this session`;
  document.getElementById("sum-mod-tag").textContent = mod ? mod.tag + " — " + mod.name : currentModule;
  document.getElementById("retry-btn").onclick = retryModule;

  // Breakdown
  const breakdown = document.getElementById("sum-breakdown");
  breakdown.innerHTML = "";
  sessionResults.forEach(r => {
    const row = document.createElement("div");
    row.className = "sum-row";
    row.innerHTML = `
      <div class="sum-concept">${r.concept}</div>
      <div class="sum-badge ${r.correct ? 'correct' : 'wrong'}">${r.correct ? '✓ Correct' : '✗ Wrong'}</div>
    `;
    breakdown.appendChild(row);
  });

  // SM-2 output
  buildSM2Output();
  switchTo("screen-summary");
  updateGauge(calcOverallPct());
}

function buildSM2Output() {
  const now = new Date();
  const dateStr = now.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const mod = MODULES.find(m => m.key === currentModule);
  const modName = mod ? mod.name : currentModule;
  const correct = sessionResults.filter(r => r.correct).length;
  const total = sessionResults.length;
  const pct = Math.round((correct / total) * 100);

  let lines = [];
  lines.push(`SESSION: ${dateStr} | ${currentModule} — ${modName}`);
  lines.push(`SCORE: ${correct}/${total} (${pct}%)`);
  lines.push(`─────────────────────────────────────`);
  lines.push(`CONCEPT RESULTS:`);
  sessionResults.forEach(r => {
    const status = r.correct ? "✓ CORRECT" : "✗ WRONG";
    const recommended_c = r.correct ? "raise 1 if previously C1–3" : "lower to C1 or C2";
    lines.push(`  ${status} | ${r.concept}`);
    lines.push(`    → Recommended: ${recommended_c}`);
  });
  lines.push(`─────────────────────────────────────`);
  lines.push(`SM-2 INSTRUCTIONS FOR CLAUDE:`);
  const wrongs = sessionResults.filter(r => !r.correct);
  const rights = sessionResults.filter(r => r.correct);
  if (wrongs.length > 0) {
    lines.push(`WRONG (lower confidence, reset interval):`);
    wrongs.forEach(r => lines.push(`  - ${r.concept} → C=1 or C=2, interval=1 day`));
  }
  if (rights.length > 0) {
    lines.push(`CORRECT (advance interval per SM-2):`);
    rights.forEach(r => lines.push(`  - ${r.concept} → advance per current EF`));
  }
  lines.push(`─────────────────────────────────────`);
  lines.push(`PASTE THIS BLOCK TO CLAUDE TO UPDATE TRACKER`);

  const output = document.getElementById("sm2-output");
  output.textContent = lines.join("\n");
}

function copyOutput() {
  const text = document.getElementById("sm2-output").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "✓ Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋 Copy"; btn.classList.remove("copied"); }, 2000);
  });
}

function retryModule() {
  startModule(currentModule);
}

function goHome() {
  renderHome();
  switchTo("screen-home");
}

// ═══ NAVIGATION ═══════════════════════════════════════════════════════════════
function switchTo(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

// ═══ BOOT ════════════════════════════════════════════════════════════════════
renderHome();
</script>
</body>
</html>
